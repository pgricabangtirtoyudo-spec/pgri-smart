name: Bangun APK

on:
  workflow_dispatch:
    inputs:
      versi:
        description: 'Nomor versi aplikasi, contoh 1.0.0'
        required: true
        default: '1.0.0'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tentukan nomor versi
        id: versi
        run: |
          if [ -n "${{ github.event.inputs.versi }}" ]; then
            NAMA="${{ github.event.inputs.versi }}"
          else
            NAMA="${GITHUB_REF_NAME#v}"      # tag v1.0.0 -> 1.0.0
          fi
          echo "nama=$NAMA" >> "$GITHUB_OUTPUT"
          echo "Versi yang dibangun: $NAMA (kode ${{ github.run_number }})"

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pgri-smart.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/pgri-smart.jks" >> "$GITHUB_ENV"
          else
            echo "Secret KEYSTORE_BASE64 belum diisi: APK ditandatangani dengan kunci debug (tidak bisa diperbarui di atas versi lain)."
          fi

      - name: Bangun APK rilis
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.versi.outputs.nama }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PGRI-SMART-${{ steps.versi.outputs.nama }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PGRI-SMART-apk
          path: PGRI-SMART-${{ steps.versi.outputs.nama }}.apk

      - name: Terbitkan di Releases (hanya saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PGRI SMART ${{ steps.versi.outputs.nama }}
          body: |
            APK PGRI SMART Tirtoyudo versi ${{ steps.versi.outputs.nama }} (kode versi ${{ github.run_number }}).
            Pasang di atas aplikasi lama, data tidak hilang.
          files: PGRI-SMART-${{ steps.versi.outputs.nama }}.apk
