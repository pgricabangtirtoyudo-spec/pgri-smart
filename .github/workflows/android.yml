name: Bangun APK

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Periksa berkas Firebase (google-services.json)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f android/app/google-services.json ]; then
            if [ -n "$GS_JSON" ]; then
              echo "$GS_JSON" > android/app/google-services.json
            else
              echo "::error::File android/app/google-services.json belum ada. Unduh dari Firebase (Project settings > Your apps) lalu unggah ke folder android/app di GitHub."
              exit 1
            fi
          fi

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pgri-smart.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/pgri-smart.jks" >> "$GITHUB_ENV"
          else
            echo "Secret KEYSTORE_BASE64 belum diisi: APK ditandatangani dengan kunci debug (tidak bisa diperbarui di atas versi lain)."
          fi

      - name: Bangun APK rilis
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: gradle -p android assembleRelease bundleRelease --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PGRI-SMART.apk

      - name: Ganti nama AAB (untuk Google Play)
        run: cp android/app/build/outputs/bundle/release/app-release.aab PGRI-SMART.aab

      - uses: actions/upload-artifact@v4
        with:
          name: PGRI-SMART-apk
          path: PGRI-SMART.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PGRI-SMART-aab
          path: PGRI-SMART.aab

      - name: Terbitkan di Releases (hanya saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PGRI-SMART.apk
